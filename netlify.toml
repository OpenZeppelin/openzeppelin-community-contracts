[build]
command = "npm run docs"
publish = "build/site"

# Hardhat 3 requires Node >= 22.13. Netlify's per-site default is older than that, which aborts
# `prepare-docs` before it can run docgen. Keep this in sync with `NODE_DEFAULT_VERSION` in
# .github/actions/setup/action.yml.
[build.environment]
NODE_VERSION = "24"
