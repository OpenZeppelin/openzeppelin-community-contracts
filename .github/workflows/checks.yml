name: checks

on:
  push:
    branches:
      - master
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # actions/checkout
  actions: read # gas-compare: gh run list / gh run download
  pull-requests: read # gas-compare: gh pr diff

env:
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          foundry: 'on'
      - run: npm run lint
      - run: forge compile && forge lint --deny notes --only-lint unused-import

  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          foundry: 'on' # needed by npm run test:pragma
      - name: Run tests and generate gas report
        run: npm run test -- --gas-stats-json gasReport.json
      - name: Check linearisation of the inheritance graph
        run: npm run test:inheritance
      - name: Check pragma validity
        run: npm run test:pragma -- --concurrency 1
      - name: Check procedurally generated contracts are up-to-date
        run: npm run test:generation
      - name: Compare gas costs
        uses: ./.github/actions/gas-compare
        with:
          token: ${{ github.token }}
          report: gasReport.json

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Run coverage
        run: npm run coverage
      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up environment
        uses: ./.github/actions/setup
      - uses: crytic/slither-action@v0.4.1

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run CodeSpell
        uses: codespell-project/actions-codespell@v2.4.3
        with:
          check_hidden: true
          check_filenames: true
          skip: package-lock.json,*.pdf,vendor
